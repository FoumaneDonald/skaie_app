<div class="d-flex" id="wrapper" [class.toggled]="sidebarOpen()">
    <!-- Sidebar -->
    <div class="border-end bg-dark text-white" id="sidebar-wrapper">
        <div class="sidebar-heading border-bottom border-secondary p-4 d-flex align-items-center gap-2">
            <div class="bg-primary rounded px-2 py-1 fw-bold text-white">SK</div>
            <span class="fs-5 fw-bold tracking-tight">{{ 'brand' | translate }}</span>
        </div>

        <div class="list-group list-group-flush flex-grow-1 px-2 mt-3">
            @for (item of navItems; track item.route) {
            <a [routerLink]="item.route" routerLinkActive="active"
                class="list-group-item list-group-item-action bg-transparent text-secondary border-0 rounded-3 mb-1 d-flex align-items-center gap-3 py-2 px-3"
                (click)="sidebarOpen.set(false)">
                <span [innerHTML]="icons[item.icon]" class="d-flex opacity-75"></span>
                <span class="small fw-medium">{{ item.label | translate }}</span>
            </a>
            }
        </div>

        <div class="mt-auto p-3 border-top border-secondary">
            <div class="mb-3 px-2">
                <app-language-switcher />
            </div>

            @if (authState.user$ | async; as user) {
            <div class="d-flex align-items-center gap-3 bg-secondary bg-opacity-10 p-2 rounded-3 mb-2">
                <div class="bg-primary bg-opacity-25 text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold"
                    style="width: 38px; height: 38px; min-width: 38px;">
                    {{ user.name.charAt(0).toUpperCase() }}
                </div>
                <div class="overflow-hidden">
                    <div class="text-white small fw-bold text-truncate">{{ user.name }}</div>
                    <div class="text-muted extra-small text-capitalize" style="font-size: 0.7rem;">{{ user.role }}</div>
                </div>
            </div>
            }

            <button class="btn btn-sm btn-outline-danger border-0 w-100 d-flex align-items-center gap-2"
                (click)="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                <span class="small">{{ 'auth.logout' | translate }}</span>
            </button>
        </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="bg-black min-vh-100 d-flex flex-column">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary d-lg-none">
            <div class="container-fluid">
                <button class="btn btn-dark" (click)="sidebarOpen.set(!sidebarOpen())">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <span class="navbar-brand ms-2 fw-bold small">SK {{ 'brand' | translate }}</span>
            </div>
        </nav>

        <div class="container-fluid p-4 p-md-5">
            <router-outlet />
        </div>
    </div>
</div>
